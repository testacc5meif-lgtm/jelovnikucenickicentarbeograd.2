<!doctype html>
<html lang="sr-Cyrl-RS">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Јеловник Ученичког центра Београд са обавештењима пред сваки оброк.">
<title>Јеловник</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Јеловник">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1>Јеловник</h1>
      <p class="sub">Ученички центар Београд</p>
    </div>
    <button id="bell" class="bell" type="button" aria-label="Обавештења">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22Zm7-5.6-1.6-1.9v-3.9a5.5 5.5 0 0 0-4.2-5.3V4.6a1.2 1.2 0 0 0-2.4 0v.7a5.5 5.5 0 0 0-4.2 5.3v3.9L5 16.4a.8.8 0 0 0 .6 1.3h12.8a.8.8 0 0 0 .6-1.3Z"/></svg>
      <span id="bellDot" class="dot" hidden></span>
    </button>
  </div>
  <div id="upNext" class="upnext" hidden></div>
</header>

<nav id="strip" class="strip" aria-label="Избор дана"></nav>

<main id="main">
  <div id="dayHead" class="dayhead"></div>
  <div id="meals" class="meals"></div>
  <div id="empty" class="empty" hidden>
    <p>За овај дан још нема јеловника.</p>
    <p class="muted">Нови јеловник се објављује на почетку и средином месеца.</p>
  </div>
</main>

<footer id="foot" class="foot"></footer>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <h2 id="sheetTitle">Обавештења</h2>
    <p class="muted">Јављамо ти пред сваки оброк. Порука не открива мени, само те подсети да завириш.</p>
    <ul class="prefs" id="prefs"></ul>
    <p id="sheetNote" class="note" hidden></p>
    <div class="sheet-actions">
      <button id="sheetClose" class="btn ghost" type="button">Затвори</button>
      <button id="sheetSave" class="btn" type="button">Сачувај</button>
    </div>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
